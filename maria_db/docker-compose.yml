services:
  mariadb:
    image: mariadb:11.8
    container_name: mariadb
    restart: unless-stopped

    environment:
      TZ: America/La_Paz

      MARIADB_ROOT_PASSWORD: RootPasswordSegura123
      MARIADB_DATABASE: lorawan_db
      MARIADB_USER: lorawan_user
      MARIADB_PASSWORD: PasswordSegura123

    ports:
      - "3306:3306"

    volumes:
      - mariadb_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  mariadb_data: